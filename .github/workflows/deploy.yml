# Publie automatiquement le site sur GitHub Pages a chaque push
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/blissful-darwin-nrdl8p]
  # Permet aussi de lancer la publication manuellement depuis l'onglet Actions
  workflow_dispatch:

# Droits necessaires pour publier sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Evite que Playwright telecharge un navigateur (inutile pour la publication)
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages automatiquement si ce n'est pas deja fait
          enablement: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
